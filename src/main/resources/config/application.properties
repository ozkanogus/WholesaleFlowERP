spring.application.name=wholesale-flow-erp

#spring.jpa.properties.hibernate.jdbc.time_zone= UTC
spring.jpa.properties.hibernate.id.new_generator_mappings= true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit= true
spring.jpa.properties.hibernate.cache.use_second_level_cache= false
spring.jpa.properties.hibernate.cache.use_query_cache= false
spring.jpa.properties.hibernate.generate_statistics= false
spring.jpa.properties.hibernate.jdbc.batch_size= 25
spring.jpa.properties.hibernate.order_inserts= true
spring.jpa.properties.hibernate.order_updates= true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch= true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding= true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy= org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy= org.springframework.boot.hibernate.SpringImplicitNamingStrategy

spring.jpa.open-in-view= false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
# Supply SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD externally; no bundled connection credentials.
spring.datasource.hikari.poolName=Hikari
spring.datasource.hikari.auto-commit=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
server.port=8082



spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm
spring.mvc.format.time=HH:mm

#loging level
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.io.github.ozkanogus.wholesaleflow=DEBUG
