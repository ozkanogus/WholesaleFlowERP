name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default-build:
    name: Java 21 / default build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify default build
        run: ./mvnw -B -ntp clean verify

  postgres-build:
    name: Java 21 / PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: grocery_ci_test
          POSTGRES_USER: grocery_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U grocery_ci -d grocery_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      GROCERY_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/grocery_ci_test
      GROCERY_TEST_DB_USER: grocery_ci
      GROCERY_TEST_DB_PASSWORD: ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Flyway and PostgreSQL profile
        run: ./mvnw -B -ntp -Pdev,postgres-tests clean verify
